short_bio: >-
  <p>
    I am a PhD student at Nanyang Technological University, Singapore, under the supervision of Prof. <a href="https://guosheng.github.io/" target="_blank">Guosheng Lin</a> .
    I received my M.S. degree from the School of Electronic Information and Electrical Engineering at Shanghai Jiao Tong University, China, where I was advised by Prof. <a href="https://nanyangye.github.io/" target="_blank">Nanyang Ye</a>. 
    My previous research primarily focused on out-of-distribution (OoD) generalization problems in traditional computer vision tasks, such as object detection. 
  </p>
  <p>
    Currently, my research focuses on <strong>generative world models</strong> and <strong>embodied AI</strong>.
    Feel free to reach out to discuss potential collaboration !
  </p>

